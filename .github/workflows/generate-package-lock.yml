name: Generate package lock

on:
  push:
    branches: [fix/add-template-package-lock]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json
            git commit -m "Add template package lock"
            git push origin HEAD:fix/add-template-package-lock
          else
            echo "package-lock.json is already current."
          fi
