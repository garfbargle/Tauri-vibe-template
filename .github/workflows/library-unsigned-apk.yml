name: Library release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-release-apk
  cancel-in-progress: false

jobs:
  gate:
    name: Check Android release version
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare tracked version with latest Library release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          INITIALIZED="$(node -p "require('./template.config.json').initialized ? 'true' : 'false')"
          SEED_REPO=false
          if [ "$GITHUB_REPOSITORY" = "garfbargle/Tauri-vibe-template" ]; then
            SEED_REPO=true
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$INITIALIZED" != "true" ] && [ "$SEED_REPO" != "true" ]; then
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Repository has not run template initialization; skipping release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Library releases are only produced from main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"

          CURRENT="$CURRENT" RELEASES="$RUNNER_TEMP/releases.json" python3 <<'PY' > "$RUNNER_TEMP/gate.env"
          import json, os, re

          current_text = os.environ["CURRENT"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current_text)
          if not match:
              raise SystemExit(f"tracked version must be stable X.Y.Z for Library release: {current_text}")
          current = tuple(map(int, match.groups()))

          releases = json.load(open(os.environ["RELEASES"]))
          versions = []
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              tag = release.get("tag_name", "")
              hit = re.fullmatch(r"android-v(\d+)\.(\d+)\.(\d+)", tag)
              if hit:
                  versions.append((tuple(map(int, hit.groups())), tag))

          latest_version, latest_tag = max(versions, default=((0, 0, 0), ""))
          print(f"latest={latest_tag}")
          print(f"should_release={'true' if current > latest_version else 'false'}")
          PY

          cat "$RUNNER_TEMP/gate.env" >> "$GITHUB_OUTPUT"
          . "$RUNNER_TEMP/gate.env"
          echo "Tracked Android version: $CURRENT; latest Library release: ${latest:-<none>}; release: $should_release" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build unsigned APK for Library
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run icons

      - name: Prepare Android project
        run: npm run android:prepare

      - name: Verify template and release invariants
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "garfbargle/Tauri-vibe-template" ]; then
            TAURI_VIBE_TEMPLATE_SEED=1 npm run doctor:release
          else
            npm run doctor:release
          fi

      - name: Verify Android scaffold policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = "garfbargle/Tauri-vibe-template" ]; then
            echo "Template seed repository may bootstrap-generate Android as an integration smoke test." >> "$GITHUB_STEP_SUMMARY"
          else
            if ! git ls-files --error-unmatch src-tauri/gen/android/app/build.gradle.kts >/dev/null 2>&1; then
              echo "Initialized apps must commit src-tauri/gen/android before Library release." >&2
              exit 1
            fi
            git diff --exit-code -- src-tauri/gen/android
            if [ -n "$(git status --porcelain --untracked-files=all -- src-tauri/gen/android)" ]; then
              echo "Android preparation produced uncommitted native files." >&2
              git status --short -- src-tauri/gen/android >&2
              exit 1
            fi
          fi

      - name: Build unsigned release APK
        run: npm run tauri android build -- --apk --target aarch64

      - name: Verify unsigned APK and Library contract
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          IDENTIFIER="$(node -p "require('./src-tauri/tauri.conf.json').identifier")"
          SLUG="$(node -p "require('./package.json').name")"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -Fq "package: name='$IDENTIFIER'"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Expected Library artifact to be unsigned, but apksigner accepted it." >&2
            exit 1
          fi
          mkdir -p library-artifact
          cp "$APK" "library-artifact/${SLUG}-${RELEASE_VERSION}-aarch64-release-unsigned.apk"

      - name: Upload unsigned APK for Library
        uses: actions/upload-artifact@v4
        with:
          name: library-unsigned-apk
          path: library-artifact/*.apk
          if-no-files-found: error
          retention-days: 7
