name: Library release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: library-release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: npm run version:sync -- "v${{ inputs.version }}"

      - name: Generate platform icons
        run: npm run icons

      - name: Generate and patch Android project
        run: npm run android:reset

      - name: Verify template invariants
        run: npm run doctor:release

      - name: Build unsigned release APK
        run: npm run tauri android build -- --apk --target aarch64

      - name: Verify unsigned APK and Library contract
        shell: bash
        run: |
          set -euo pipefail
          IDENTIFIER="$(node -p "require('./src-tauri/tauri.conf.json').identifier")"
          SLUG="$(node -p "require('./package.json').name")"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -Fq "package: name='$IDENTIFIER'"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Expected Library artifact to be unsigned, but apksigner accepted it." >&2
            exit 1
          fi
          mkdir -p library-artifact
          cp "$APK" "library-artifact/${SLUG}-${{ inputs.version }}-aarch64-release-unsigned.apk"

      - name: Upload unsigned APK for Library
        uses: actions/upload-artifact@v4
        with:
          name: library-unsigned-apk
          path: library-artifact/*.apk
          if-no-files-found: error
          retention-days: 7
